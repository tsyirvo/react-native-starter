[tools]
node = "26"
bun = "1.4.4"
"npm:eas-cli" = "27"
"npm:agent-device" = "0.21.42"
hk = "2.13.0"
gitleaks = "8.30.1"

[env]
# Keep the repo's locally installed binaries (Biome, Jest, TS...) on the PATH
_.path = ["node_modules/.bin"]
# Let hk resolve its tools through mise so the hooks work even when a
# contributor has not activated mise in their shell
HK_MISE = "1"

# Scripts live in package.json (`bun run <script>`); mise only provides the
# toolchain and the git hooks setup.
