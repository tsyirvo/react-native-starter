[tools]
node = "26"
bun = "1.4.0"
"npm:eas-cli" = "23"
# Git hook manager, `pkl` is what evaluates hk.pkl
hk = "1.56.1"
pkl = "0.30"

[env]
# Keep the repo's locally installed binaries (Biome, Jest, TS...) on the PATH
_.path = ["node_modules/.bin"]
# Let hk resolve its tools through mise so the hooks work even when a
# contributor has not activated mise in their shell
HK_MISE = "1"

# Wire the git hooks up as soon as the toolchain is installed, so nobody has to
# remember to run `hk install` after cloning
[hooks]
postinstall = "hk install --mise"

#### QUALITY ####

[tasks.lint]
description = "Run Biome linter on all files"
run = "bunx biome lint --files-ignore-unknown=true ./"
alias = "l"

[tasks."lint:fix"]
description = "Run Biome linter with auto-fix"
run = "bunx biome lint --write --files-ignore-unknown=true ./"
alias = "lf"

[tasks.format]
description = "Check formatting with Biome"
run = "bun run format:check"
alias = "f"

[tasks."format:fix"]
description = "Format all files with Biome"
run = "bun run format"
alias = "ff"

[tasks.check]
description = "Run all code quality checks (lint + format)"
run = "bunx biome check --files-ignore-unknown=true ./"
alias = "c"

[tasks."check:fix"]
description = "Fix all code quality issues (lint + format)"
run = "bun run lint"
alias = "cf"

[tasks."check:ci"]
description = "Read-only Biome check for CI"
run = "bun run lint:ci"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "bun run lint:ts"
alias = "tc"

[tasks.fix]
description = "Fix all code quality issues (lint + format)"
# Run sequentially: these all write to the same files, so parallel `depends` would race
run = [
  "mise run lint:fix",
  "mise run format:fix",
  "mise run check:fix",
]

#### TESTS ####

[tasks.test]
description = "Run unit tests without coverage"
run = "bun run test"
alias = "t"

[tasks."test:coverage"]
description = "Run unit tests with coverage"
run = "bun run test:coverage"
alias = "tcov"

[tasks."test:e2e"]
description = "Run Maestro E2E tests"
run = "bun run test:e2e"

[tasks.ci]
description = "Run all CI checks (typecheck + biome + test)"
depends = ["typecheck", "check:ci", "test"]

#### GIT HOOKS ####

[tasks."hooks:install"]
description = "Register the hk git hooks in this repo"
run = "hk install --mise"

[tasks."hooks:check"]
description = "Run the pre-push checks over the whole repo (read-only)"
run = "hk check --all"
alias = "hc"

[tasks."hooks:fix"]
description = "Run the pre-commit fixers over the whole repo"
run = "hk fix --all"
alias = "hf"

[tasks."hooks:pre-commit"]
description = "Run the pre-commit hook on the staged files"
run = "hk run pre-commit"

[tasks."hooks:pre-push"]
description = "Run the pre-push hook"
run = "hk run pre-push"

#### UTILITIES ####

[tasks.clean]
description = "Clean caches and build artifacts"
run = [
  "bun run clean:watchman",
  "rm -rf .expo coverage node_modules/.cache",
]
alias = "cl"
