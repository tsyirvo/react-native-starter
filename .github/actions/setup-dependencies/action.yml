name: Setup dependencies
description: Set up Node, Bun, and the shared dependency cache before installing packages

runs:
  using: composite
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.x

    - name: Restore cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          ~/.bun/install/cache
        key: node26-${{ hashFiles('**/bun.lock') }}-${{ runner.os }}
        restore-keys: node26-${{ hashFiles('**/bun.lock') }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
