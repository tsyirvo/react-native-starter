name: Build the app for development

on: workflow_dispatch

jobs:
  build_dev_app:
    name: Build the app for development
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check build credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "Provide a DOPPLER_TOKEN repository secret scoped to the dev config. Sync that config to the EAS development environment before building."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 23.0.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Doppler
        uses: dopplerhq/cli-action@v3

      - name: EAS Build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --config dev -- env APP_ENV=development EXPO_NO_DOTENV=1 eas build --platform all --non-interactive --profile development --no-wait
