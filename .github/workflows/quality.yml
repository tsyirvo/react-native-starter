name: Quality

on:
  pull_request:
    types: [ opened, reopened, synchronize ]

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Run TypeScript checks
        run: bun run lint:ts

      - name: Run Biome checks (lint + format)
        run: bun run lint:ci

      - name: Restore Jest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('bun.lock', 'jest.config.js', 'babel.config.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('bun.lock', 'jest.config.js', 'babel.config.js', 'tsconfig.json') }}-

      - name: Run Tests
        run: bun run test
