name: Quality

on:
  pull_request:
    types: [ opened, reopened, synchronize ]

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    # Skip the Release Please PR: it only bumps the version and changelog.
    # A skipped job still satisfies a required status check.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Restore Jest cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ github.sha }}
          restore-keys: jest-${{ runner.os }}-

      - name: Verify
        run: bun run verify
