name: PR title

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  contents: read

jobs:
  # PRs are squash-merged with the PR title as the commit message, and
  # release-please reads that message. The commit-msg hook can't see it.
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      # For the hk version in mise.toml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: hk
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$TITLE" in
            'fixup! '* | 'squash! '* | 'amend! '*)
              echo "::error::PR title must not start with fixup!, squash! or amend!"
              exit 1
              ;;
          esac
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          hk util check-conventional-commit "$RUNNER_TEMP/title"
