name: Verify main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Verify
        run: bun run verify

      # PR runs can read caches saved on the default branch, not those of other PRs.
      # The cache starts empty on each run, so it never keeps stale entries.
      - name: Save CI cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/jest
          key: ci-${{ runner.os }}-${{ github.sha }}
