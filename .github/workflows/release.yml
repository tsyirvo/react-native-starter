name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Keeps the release PR up to date with main. Merging that PR (after both
  # stores approve the build) bumps the version, tags it and creates the
  # GitHub release. See docs/guides/releasing.md.
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PAT, not GITHUB_TOKEN: GitHub runs no workflows on PRs that
      # GITHUB_TOKEN opens, so the release PR would get no CI.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
