name: Cache Bun dependencies

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/caching.yml"
      - ".github/actions/setup-dependencies/action.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  search:
    name: Search for existing cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
      cache-key: ${{ steps.key.outputs.cache-key }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate cache key
        id: key
        run: |
          echo "cache-key=node26-${{ hashFiles('**/bun.lock') }}-${{ runner.os }}" >> "$GITHUB_OUTPUT"

      - name: Lookup cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ steps.key.outputs.cache-key }}
          lookup-only: true

  cache:
    name: Cache
    needs: search
    runs-on: ubuntu-latest
    if: ${{ !needs.search.outputs.cache-hit }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Save cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ needs.search.outputs.cache-key }}

  cleanup:
    name: Cleanup old caches
    needs: [ search, cache ]
    runs-on: ubuntu-latest
    if: ${{ needs.cache.result == 'success' && github.event_name == 'push' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CACHE_KEY: ${{ needs.search.outputs.cache-key }}
    permissions:
      # `actions:write` permission is required to delete caches
      #   See also: https://docs.github.com/en/rest/actions/cache?apiVersion=2022-11-28#delete-a-github-actions-cache-for-a-repository-using-a-cache-id
      actions: write
      contents: read

    steps:
      - name: Cleanup old dependency caches
        run: |
          for cache_id in $(gh cache list --ref refs/heads/main --key node26- --limit 100 --json id,key --jq '.[] | select(.key != env.CACHE_KEY) | .id'); do
            gh cache delete "$cache_id"
          done
