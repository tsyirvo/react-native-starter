name: Tag and release

on:
  pull_request_target:
    branches: [develop]
    types: [closed, labeled]

concurrency:
  group: tag-and-release-develop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'to deploy') &&
      (github.event.action == 'closed' || github.event.label.name == 'to deploy')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify merged commit is the tip of develop
        env:
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch origin develop
          if [ "$(git rev-parse origin/develop)" != "$MERGE_COMMIT" ]; then
            echo "develop has moved since this PR was merged; label the latest merged PR instead."
            exit 1
          fi

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Update the app version and tag it
        run: bunx standard-version@9.5.0

      - name: Push version and tag
        id: push
        run: |
          tag=$(git describe --tags --abbrev=0)
          git push origin HEAD:develop --follow-tags
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not start tag-triggered workflows, so release here.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.push.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes
