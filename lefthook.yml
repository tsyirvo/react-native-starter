pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn lint {staged_files} --no-warn-ignored
    typescript:
      glob: '*.{ts,tsx}'
      run: npx tsc-files {staged_files} src/types/react-query.d.ts src/types/declaration.d.ts src/domain/theme/unistyles.ts
    tests:
      run: yarn test {staged_files} --findRelatedTests --passWithNoTests --coverage=false

commit-msg:
  commands:
    'lint commit message':
      run: yarn run commitlint --edit {1}

post-checkout:
  scripts:
    'post-checkout.sh':
      runner: bash
