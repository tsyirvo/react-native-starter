pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn lint {staged_files} --no-warn-ignored
    typescript:
      glob: '*.{ts,tsx}'
      run: tsc-files {staged_files}
    tests:
      run: yarn test {staged_files} --findRelatedTests --passWithNoTests --coverage=false

commit-msg:
  commands:
    'lint commit message':
      run: yarn run commitlint --edit {1}

post-checkout:
  scripts:
    'post-checkout.sh':
      runner: bash
